tests:
  drivers.i2s:
    depends_on: i2s
    tags:
      - drivers
      - userspace
    filter: not CONFIG_I2S_TEST_USE_GPIO_LOOPBACK
    platform_exclude:
      - frdm_mcxe31b/mcxe31b
      - frdm_mcxn947/mcxn947/cpu0
      - mcx_n9xx_evk/mcxn947/cpu0
      - mimxrt595_evk/mimxrt595s/cm33
      - mimxrt685_evk/mimxrt685s/cm33
      - nrf54h20dk/nrf54h20/cpuapp
      - mimxrt1060_evk/mimxrt1062/qspi
      - frdm_mcxn236/mcxn236
      - mimxrt1180_evk/mimxrt1189/cm33
      - mimxrt1180_evk/mimxrt1189/cm7
      - phyboard_atlas/mimxrt1176/cm7
  drivers.i2s.gpio_loopback:
    depends_on:
      - i2s
      - gpio
    tags:
      - drivers
      - userspace
    filter: CONFIG_I2S_TEST_USE_GPIO_LOOPBACK
    harness: ztest
    platform_exclude:
      - frdm_mcxn947/mcxn947/cpu0
      - mcx_n9xx_evk/mcxn947/cpu0
      - mimxrt595_evk/mimxrt595s/cm33
      - mimxrt685_evk/mimxrt685s/cm33
      - nrf54h20dk/nrf54h20/cpuapp
      - frdm_mcxn236/mcxn236
      - phyboard_atlas/mimxrt1176/cm7
    harness_config:
      fixture: gpio_loopback
  drivers.i2s.gpio_loopback.nrf54h:
    depends_on: i2s
    tags:
      - drivers
      - userspace
    harness_config:
      fixture: i2s_loopback
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp
  drivers.i2s.mcux_dma.build:
    build_only: true
    tags:
      - drivers
      - i2s
    extra_configs:
      - CONFIG_I2S_MCUX_SAI_HOST_SEAM_TEST=y
    platform_allow:
      - frdm_mcxe31b
      - imx8mp_evk/mimx8ml8/m7/ddr
      - mimxrt1170_evk@A/mimxrt1176/cm7
    integration_platforms:
      - frdm_mcxe31b
      - imx8mp_evk/mimx8ml8/m7/ddr
      - mimxrt1170_evk@A/mimxrt1176/cm7
  drivers.i2s.mcux_dma.edma_v3.build:
    build_only: true
    tags:
      - drivers
      - i2s
    extra_configs:
      - CONFIG_I2S_MCUX_SAI_HOST_SEAM_TEST=y
    extra_args:
      - DTC_OVERLAY_FILE=boards/frdm_mcxa577_edma_v3.overlay
      - EXTRA_CONF_FILE=boards/frdm_mcxa577_edma_v3.conf
    platform_allow:
      - frdm_mcxa577
    integration_platforms:
      - frdm_mcxa577
  drivers.i2s.mcux_dma.mixed.build:
    build_only: true
    tags:
      - drivers
      - i2s
    extra_configs:
      - CONFIG_I2S_MCUX_SAI_HOST_SEAM_TEST=y
    extra_args:
      - DTC_OVERLAY_FILE=boards/native_sim_mcux_mixed.overlay
      - EXTRA_CONF_FILE=boards/native_sim_mcux_mixed.conf
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  drivers.i2s.mcux_host_seam:
    tags:
      - drivers
      - i2s
    harness: ztest
    extra_args:
      - DTC_OVERLAY_FILE=boards/native_sim_mcux_mixed.overlay
      - EXTRA_CONF_FILE=boards/native_sim_mcux_mixed.conf
    extra_configs:
      - CONFIG_I2S_MCUX_SAI_HOST_SEAM_TEST=y
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
