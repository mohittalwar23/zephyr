# The nRF PDM peripheral only produces 16-bit samples, and on this part the
# usable rate is 16 kHz, so pin the pipeline there.

CONFIG_AUDIO_DMIC_NRFX_PDM=y
CONFIG_AUDIO_CODEC_DUMMY=y
CONFIG_I2S_NRFX=y

# The sample logs over USB CDC ACM on this board.
CONFIG_MP_ZAUD_BUFFER_POOL_SZ_MAX=4096
CONFIG_MP_ZAUD_BUFFER_POOL_NUM_MAX=24

# The onboard microphone's supply must be switched on.
CONFIG_REGULATOR=y
