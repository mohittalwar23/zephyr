CONFIG_REGULATOR=y

# 16 kHz, 10 ms, 2 channels, 16-bit
CONFIG_MPIPE_AUD_BUFFER_POOL_SZ_MAX=640
CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=14

# Keep the PDM clock at 32 MHz / 31 so capture and playback share one rate
CONFIG_MPIPE_AUD_DMIC_SRC_PDM_CLK_FREQ_MAX=1100000
