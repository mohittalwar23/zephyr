# The PLLI2S is only exact at 8, 16 and 32 kHz on this board. The microphone
# needs 64 bit clocks per frame, which the I2S node asks for with
# channel-length-32 rather than by widening the samples.
CONFIG_SAMPLE_AUDIO_SAMPLE_RATE=16000
CONFIG_SAMPLE_AUDIO_BIT_WIDTH=16

# A MEMS microphone into a speaker needs considerably more than unity.
CONFIG_SAMPLE_AUDIO_GAIN_PERCENT=400

# 16 kHz, 10 ms, 2 channels, 16-bit. The source holds its queue of 4 plus 2,
# the sink its queue of 4 plus 1, and the pool carries one more.
CONFIG_MPIPE_AUD_BUFFER_POOL_SZ_MAX=640
CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=12

CONFIG_ASSERT=y
