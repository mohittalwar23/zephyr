# Applied on top of nucleo_f401re.conf for the PDM microphone variant:
#   west build -b nucleo_f401re samples/subsys/mpipe/audio_loopback -- \
#     -DEXTRA_DTC_OVERLAY_FILE=boards/nucleo_f401re_dmic.overlay \
#     -DEXTRA_CONF_FILE=boards/nucleo_f401re_dmic.conf

CONFIG_SAMPLE_AUDIO_SOURCE_DMIC=y

# One 10 ms frame of PDM for a single microphone at 16 kHz.
CONFIG_DMIC_MPXXDTYY_PDM_BLOCK_SIZE=2560

# The PDM slab holds four blocks, and the I2S driver keeps its queue plus two,
# so the queue has to fit in what is left.
CONFIG_I2S_STM32_RX_BLOCK_COUNT=2

# The DMIC source holds one block, the sink its queue plus one, and one spare.
CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=7
