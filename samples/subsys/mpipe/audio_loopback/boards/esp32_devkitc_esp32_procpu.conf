CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_ESP32=y
CONFIG_I2S=y
CONFIG_I2S_ESP32=y
CONFIG_I2S_ESP32_PDM_RX=y

# 16 kHz, 10 ms, 2 channels, 16-bit. The microphone is mono but the peripheral
# frames it as stereo, so the pool is sized for two channels.
CONFIG_MPIPE_AUD_BUFFER_POOL_SZ_MAX=640
CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=14
