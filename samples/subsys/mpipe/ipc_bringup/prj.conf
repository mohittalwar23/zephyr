CONFIG_MPIPE=y
CONFIG_MPIPE_IPC=y
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# ipc_static_vrings_init() calls virtqueue_allocate() once per ring, and that
# reaches k_malloc(). Without a heap, ipc_service_open_instance() fails with
# -ENOMEM at runtime -- it builds and links cleanly, so only the board catches
# it. Each queue costs sizeof(struct virtqueue) plus one 8-byte vq_desc_extra
# per descriptor, and optimal_num_desc() derives that count from the size of
# the shared region, so this floor rises if MPIPE_IPC_SHM grows. 4096 is what
# upstream's own static-vrings sample uses.
CONFIG_HEAP_MEM_POOL_SIZE=4096
