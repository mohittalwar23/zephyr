# Capture live from the I2S receiver and tee the audio to the codec as well.
# The AUDIOMIX handoff is required: the M7 can only drive the audio clock tree
# once boot firmware has given the domain up.
CONFIG_SAMPLE_IPC_INFER_SOURCE_I2S=y

CONFIG_IMX8M_M7_AUDIOMIX_BOOT_HANDOFF=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_DMA=y
CONFIG_DMA_NXP_SDMA=y
CONFIG_AUDIO_CODEC=y

CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
# The tee is what makes the audio both audible and available to the peer.
CONFIG_MPIPE_BASE_TEE=y
CONFIG_MPIPE_AUD=y
CONFIG_MPIPE_PLAYER=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y

# One buffer is 10 ms of 16 kHz stereo 16-bit = 640 bytes.
#
# The pool has to cover everything in flight at once, and a tee plus a
# cross-core branch is a lot more than a linear pipeline: the tee references the
# same buffer on both branches, the codec branch holds a few in its transmit
# queue, and the IPC branch holds up to MPIPE_IPC_PLUGIN_MAX_BUFFERS of them for
# a whole round trip to the DSP and back. Sized too small, the I2S source cannot
# allocate and the pipeline stops with -ENOBUFS.
CONFIG_MPIPE_AUD_BUFFER_POOL_SZ_MAX=768
CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=24

# The shared net_buf pool defaults to one buffer, which is enough only for a
# pipeline that holds one buffer at a time. This one holds many.
CONFIG_MPIPE_NET_BUF_POOL_COUNT=32
CONFIG_MPIPE_AUD_I2S_CODEC_SINK_SILENCE_PRIME=y

# The M7 runs from TCM, and the pipeline plus the IPC stack do not leave room
# for deferred logging's machinery. Minimal mode keeps the messages and drops
# the formatting engine behind them.
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MPIPE_PLAYER_DUMP_ON_STATE_CHANGE=n
CONFIG_MPIPE_IPC_PLUGIN=y
