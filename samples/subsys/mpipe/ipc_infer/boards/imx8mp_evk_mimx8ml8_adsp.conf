CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y

# The DSP runs the far half of the pipeline: an IPC source feeding inference.
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_QUEUE=y
# Keep the mailbox workqueue shallow: it only hands buffers to this queue.
# micro_speech runs on the queue's worker and needs substantially more than
# the generic 1 KiB streaming stack.
CONFIG_MPIPE_BASE_QUEUE_MAX_SIZE=8
CONFIG_MPIPE_THREAD_STACK_SIZE=8192
CONFIG_MPIPE_AUD=y
CONFIG_MPIPE_PLAYER=y
CONFIG_MPIPE_IPC_PLUGIN=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y

# Two endpoints on one instance: control, and the pipeline's audio.
CONFIG_IPC_SERVICE_BACKEND_RPMSG_NUM_ENDPOINTS_PER_INSTANCE=4
