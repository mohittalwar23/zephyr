sample:
  name: libMP audio pipeline
tests:
  sample.mp.audio.pipeline:
    tags:
      - audio
      - samples
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "DMIC capture started"
        - "EOS received from element"
        - "Pipeline stopped"
