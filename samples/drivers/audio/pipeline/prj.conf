CONFIG_LOG=y

CONFIG_HEAP_MEM_POOL_SIZE=25000
CONFIG_MAIN_STACK_SIZE=4096

# libMP core + audio plugin
CONFIG_MP=y
# capsfilter lives in the zbase base-elements plugin
CONFIG_MP_PLUGIN_ZBASE=y
CONFIG_MP_CAPSFILTER=y
CONFIG_MP_PLUGIN_ZAUD=y

# Audio subsystems used by the zaud plugin
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_CODEC=y
CONFIG_I2S=y
