description: |
  NXP Smart DMA controller.

  The channel cell is the peripheral event/request source. The driver allocates
  the physical SDMA channel independently with dma_request_channel(). The mux
  cell selects an MCUX SDMA peripheral script: 5 is Normal SP and 6 is
  MultiFifo PDM. Bit 7 is reserved for the driver's runtime append-mode flag
  and must not appear in a devicetree DMA specifier.

compatible: "nxp,sdma"

include: [dma-controller.yaml, base.yaml]

properties:
  reg:
    required: true
  "#dma-cells":
    const: 2
  dma-requests:
    required: true
    description: Number of peripheral event/request sources

dma-cells:
  - channel
  - mux
