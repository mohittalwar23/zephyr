description: STMicroelectronics MPXXDTYY digital PDM microphone family

compatible: "st,mpxxdtyy"

include: i2s-device.yaml

properties:
  mic-count:
    type: int
    default: 1
    enum: [1, 2]
    description: |
      Microphones sharing the data line. Two are interleaved by clock edge and
      separated again in software; one is decimated directly and then spread
      across the channels the caller asked for. Every in-tree board carries a
      single microphone.
