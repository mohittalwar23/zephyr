# Common fields for STM32 I2S peripherals.

include: [i2s-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  dmas:
    required: true

  dma-names:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  mck-enabled:
    type: boolean
    description: |
      Master Clock Output function.
      An mck pin must be listed within pinctrl-0 when enabling this property.

  ioswp:
    type: boolean
    description: Swap I2S data input and output pins

  channel-length-32:
    type: boolean
    description: |
      Pad each channel to 32 bits while keeping 16-bit data, so a frame
      carries 64 bit clocks. Devices such as I2S MEMS microphones require a
      32-bit slot but supply fewer data bits. Has no effect unless the
      configured word size is 16.
